services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./uploads:/uploads

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  mysql_data: